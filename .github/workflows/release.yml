name: Release

on:
    push:
        branches: [main]
    # Lets a release be re-driven by hand if a run fails partway through.
    workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write

        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: true

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'pnpm'

            - run: pnpm install --frozen-lockfile

            - name: Build all packages
              run: pnpm turbo build

            - name: Create release PR or publish
              id: changesets
              uses: changesets/action@v1
              with:
                  title: 'chore: version packages'
                  commit: 'chore: version packages'
                  publish: pnpm changeset tag
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # --- VS Code Extension: build & publish VSIX after a version bump ---
            #
            # Gate on whether this version has been released rather than on the
            # changesets action's `published` output. That output only turns true
            # when the action publishes to a registry, and every package here is
            # private, so `changeset tag` has nothing to do and `published` is
            # always false -- which silently disabled this whole path. The earlier
            # `hasChangesets == 'false'` was true on every ordinary push instead,
            # so it re-published the unchanged version and failed against the
            # existing tag. Asking "is there already a tag for the version in
            # package.json?" is true exactly once per bump and re-runnable.
            - name: Decide whether to release
              id: gate
              run: |
                  VERSION=$(node -e "console.log(require('./packages/vscode-extension/package.json').version)")
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

                  if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
                      TAGGED=true
                  else
                      TAGGED=false
                  fi

                  # Ask the Marketplace what it actually serves. The two halves of
                  # a release fail independently -- an expired VSCE_PAT leaves the
                  # tag and GitHub release in place with nothing published -- so
                  # each is gated on its own state and can be re-driven alone.
                  LIVE=$(curl -sS -X POST                       'https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery'                       -H 'Content-Type: application/json'                       -H 'Accept: application/json;api-version=3.0-preview.1'                       -d '{"filters":[{"criteria":[{"filterType":7,"value":"FLEXCELERATE.fpd-vscode-extension"}]}],"flags":914}'                       | node -e "
                        let raw = '';
                        process.stdin.on('data', (c) => (raw += c));
                        process.stdin.on('end', () => {
                          try {
                            const ext = JSON.parse(raw).results[0].extensions;
                            console.log(ext.length ? ext[0].versions[0].version : 'none');
                          } catch { console.log('unknown'); }
                        });
                      ") || LIVE=unknown

                  if [ "$LIVE" = "$VERSION" ]; then PUBLISHED=true; else PUBLISHED=false; fi

                  echo "tagged=$TAGGED" >> "$GITHUB_OUTPUT"
                  echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
                  if [ "$TAGGED" = false ] || [ "$PUBLISHED" = false ]; then
                      echo "release=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "release=false" >> "$GITHUB_OUTPUT"
                  fi

                  echo "version $VERSION | tagged=$TAGGED | marketplace=$LIVE" >> "$GITHUB_STEP_SUMMARY"

            - name: Build VSIX
              if: steps.gate.outputs.release == 'true'
              id: vsix
              working-directory: packages/vscode-extension
              run: |
                  pnpm run package
                  pnpm exec vsce package --no-dependencies --skip-license
                  echo "vsix_path=$(ls *.vsix)" >> "$GITHUB_OUTPUT"

            - name: Create GitHub Release
              if: steps.vsix.outputs.vsix_path && steps.gate.outputs.tagged == 'false'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ steps.gate.outputs.version }}
                  name: v${{ steps.gate.outputs.version }}
                  generate_release_notes: true
                  files: packages/vscode-extension/${{ steps.vsix.outputs.vsix_path }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish to VS Code Marketplace
              if: steps.vsix.outputs.vsix_path && steps.gate.outputs.published == 'false'
              working-directory: packages/vscode-extension
              run: pnpm exec vsce publish --no-dependencies --skip-license
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}

            - name: Publish to Open VSX Registry
              if: steps.vsix.outputs.vsix_path && steps.gate.outputs.published == 'false' && env.OVSX_PAT != ''
              working-directory: packages/vscode-extension
              run: npx ovsx publish ${{ steps.vsix.outputs.vsix_path }} -p $OVSX_PAT
              env:
                  OVSX_PAT: ${{ secrets.OVSX_PAT }}
